name: Lampo
options:
  bundleIdPrefix: app.lampo
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9K3LNS3KHP
    CODE_SIGN_STYLE: Manual

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

targets:
  Lampo:
    type: application
    platform: macOS
    sources:
      - path: Lampo
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: Lampo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lampo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleLocalizations: [en, it]
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Lampo"
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: app.lampo.Lampo
            CFBundleURLSchemes: [lampo]
        NSCalendarsWriteOnlyAccessUsageDescription: Lampo adds the events you confirm to your calendar. It can't read your calendars.
        NSRemindersFullAccessUsageDescription: Lampo adds the reminders you confirm to your default list.
        NSRemindersUsageDescription: Lampo adds the reminders you confirm to your default list.
        NSMicrophoneUsageDescription: Lampo listens only while you dictate, and turns what you say into text on this Mac.
        # Sparkle. Empty in development builds (no updater); scripts/release.sh fills them from
        # Packaging/release.env. Automatic checks are off until the user agrees (Sparkle asks).
        SUFeedURL: $(LAMPO_FEED_URL)
        SUPublicEDKey: $(LAMPO_SPARKLE_PUBLIC_KEY)
        SUEnableSystemProfiling: false
        LampoWebsiteURL: $(LAMPO_WEBSITE_URL)
        LampoRepositoryURL: $(LAMPO_REPOSITORY_URL)
    entitlements:
      path: Lampo/Resources/Lampo.entitlements
      properties:
        # Hardened Runtime resource access for EventKit (events and reminders).
        com.apple.security.personal-information.calendars: true
        # Hardened Runtime resource access for the microphone ("Dictate").
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lampo.Lampo
        PRODUCT_NAME: Lampo
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: NO
        # Set LAMPO_PCC in a build that carries the managed
        # com.apple.developer.private-cloud-compute entitlement. Without it,
        # FoundationModels traps (fatalError) on any PCC request.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        LAMPO_FEED_URL: ""
        LAMPO_SPARKLE_PUBLIC_KEY: ""
        LAMPO_WEBSITE_URL: ""
        LAMPO_REPOSITORY_URL: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: --timestamp

  LampoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LampoTests
    dependencies:
      - target: Lampo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lampo.LampoTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lampo.app/Contents/MacOS/Lampo
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  Lampo:
    build:
      targets:
        Lampo: all
        LampoTests: [test]
    test:
      targets:
        - LampoTests
      gatherCoverageData: false
    run:
      config: Debug
